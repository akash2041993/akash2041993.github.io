name: Make video thumbnails and web videos

# Reads Google Drive video IDs from thumbs/list.txt, takes one still frame
# from each video (thumbs/<id>.jpg), and makes a small web copy (media/<id>.mp4)
# that plays directly on the website.
on:
  workflow_dispatch:
  push:
    paths:
      - "thumbs/list.txt"
      - ".github/workflows/thumbnails.yml"

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q gdown
      - name: Make thumbnails
        run: |
          set -u
          mkdir -p thumbs
          while read -r id; do
            [ -z "$id" ] && continue
            [ -f "thumbs/$id.jpg" ] && continue
            echo "::group::$id"
            if ! gdown --quiet "https://drive.google.com/uc?id=$id" -O /tmp/v.mp4; then
              echo "FAILED_DOWNLOAD $id" | tee -a thumbs/info.txt; echo "::endgroup::"; continue
            fi
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/v.mp4)
            wh=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 /tmp/v.mp4)
            t=$(python3 -c "d=float('${dur:-0}' or 0); print(round(max(0.5, d*0.3), 2))")
            ffmpeg -nostdin -v error -y -ss "$t" -i /tmp/v.mp4 -vf "thumbnail=50,scale='min(1280,iw)':-2" -frames:v 1 -q:v 3 "thumbs/$id.jpg"
            echo "$id size=$wh duration=$dur" | tee -a thumbs/info.txt
            rm -f /tmp/v.mp4
            echo "::endgroup::"
          done < thumbs/list.txt
          grep -v "^FAILED" thumbs/info.txt > /tmp/i || true; mv /tmp/i thumbs/info.txt
      - name: Make web videos
        run: |
          set -u
          mkdir -p media
          while read -r id; do
            [ -z "$id" ] && continue
            [ -f "media/$id.mp4" ] && continue
            echo "::group::web $id"
            if ! gdown --quiet "https://drive.google.com/uc?id=$id" -O /tmp/v.mp4 </dev/null; then
              echo "FAILED_WEB $id"; echo "::endgroup::"; continue
            fi
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/v.mp4 </dev/null)
            # Aim for about 17 MB per file, at most 1.8 Mbps video, 720p on the short side.
            vk=$(python3 -c "d=float('${dur:-60}' or 60); print(int(max(500, min(1800, 17*8*1024/d - 96))))")
            ffmpeg -nostdin -v error -y -i /tmp/v.mp4 \
              -vf "scale='if(gt(iw,ih),-2,720)':'if(gt(iw,ih),720,-2)',fps=30" \
              -c:v libx264 -preset veryfast -profile:v high -pix_fmt yuv420p \
              -b:v ${vk}k -maxrate $((vk*3/2))k -bufsize $((vk*2))k \
              -c:a aac -b:a 96k -ac 2 -movflags +faststart "media/$id.mp4"
            echo "$id web_kbps=$vk size=$(du -h media/$id.mp4 | cut -f1)" | tee -a media/info.txt
            rm -f /tmp/v.mp4
            echo "::endgroup::"
          done < thumbs/list.txt
      - name: Save thumbnails and videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbs media
          git commit -m "Add video thumbnails and web videos" || echo "Nothing new"
          git push
