name: Get the A-Zone logo from a video frame

# Takes one full-resolution frame from the Chal Chalan teaser on Google Drive
# (white title card with the A-Zone mark in the corner) and saves the top-left
# corner as logo/frame-crop.png, so the mark can be traced as a sharp vector.
on:
  workflow_dispatch:
  push:
    paths:
      - "logo/source.txt"
      - ".github/workflows/logo.yml"

permissions:
  contents: write

jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q gdown
      - name: Extract frame
        run: |
          set -u
          id=$(sed -n 2p logo/source.txt | tr -d '[:space:]')
          t=$(sed -n 3p logo/source.txt | tr -d '[:space:]')
          gdown --quiet "https://drive.google.com/uc?id=$id" -O /tmp/v.mp4
          ffmpeg -nostdin -v error -y -ss "$t" -i /tmp/v.mp4 -frames:v 1 /tmp/f.png
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 /tmp/f.png
          ffmpeg -nostdin -v error -y -i /tmp/f.png -vf "crop=iw*0.12:ih*0.17:0:0" logo/frame-crop.png
          rm -f logo/failed.txt
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A logo
          git diff --cached --quiet || git commit -m "Add full-resolution logo frame crop"
          for n in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
