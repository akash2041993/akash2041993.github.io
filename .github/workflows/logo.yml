name: Get the A-Zone logo from Instagram

# Saves the profile picture of the Instagram account named in logo/source.txt
# (the A-Zone logo) as logo/profile.jpg, in the largest size available.
on:
  workflow_dispatch:
  push:
    paths:
      - "logo/source.txt"
      - ".github/workflows/logo.yml"

permissions:
  contents: write

jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch profile picture
        run: |
          set -u
          user=$(head -1 logo/source.txt | tr -d '[:space:]')
          url=""
          # 1) Instagram's public web profile endpoint (gives the HD picture).
          curl -sS -m 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36" \
            -H "x-ig-app-id: 936619743392459" \
            "https://i.instagram.com/api/v1/users/web_profile_info/?username=$user" -o /tmp/p.json || true
          url=$(python3 -c "import json; d=json.load(open('/tmp/p.json')); u=d['data']['user']; print(u.get('profile_pic_url_hd') or u.get('profile_pic_url') or '')" 2>/dev/null || true)
          echo "api url: ${url:0:80}"
          # 2) Fallback: the link-preview image of the profile page.
          if [ -z "$url" ]; then
            curl -sSL -m 30 -A "facebookexternalhit/1.1" "https://www.instagram.com/$user/" -o /tmp/p.html || true
            url=$(grep -o '<meta property="og:image" content="[^"]*"' /tmp/p.html | head -1 | sed 's/.*content="//; s/"$//; s/&amp;/\&/g')
            echo "og url: ${url:0:80}"
          fi
          if [ -n "$url" ] && curl -fsS -m 30 "$url" -o logo/profile.jpg; then
            python3 -c "import struct,sys; print('saved', sys.argv[1])" "$(stat -c%s logo/profile.jpg) bytes"
          else
            echo "FAILED to get the profile picture" | tee logo/failed.txt
          fi
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo
          git diff --cached --quiet || git commit -m "Add A-Zone logo from Instagram"
          for n in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
